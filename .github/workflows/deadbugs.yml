# Deadbugs suites (templates/ci/modules/deadbugs), 4 shards. Each suite runs on Den and on dungeon.
# A suite that passes on Den and not on dungeon fails the job.
# Reporting mode: dungeon passes 38/65 today, so the job is continue-on-error.
# When dungeon reaches 65/65, delete the `continue-on-error` line below.
name: deadbugs
on: [push, pull_request, workflow_dispatch]
jobs:
  deadbugs:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: run shard on Den and dungeon
        run: |
          set -eu
          git clone --depth 1 https://github.com/denful/den "$RUNNER_TEMP/den"
          # shellcheck disable=SC2016
          nix develop path:./dev -c bash -c '
            set -u
            mapfile -t all < <(rg -oN --no-filename -r "\$1" "flake\.tests\.([A-Za-z0-9_-]+)" templates/ci/modules/deadbugs/*.nix | sort -u)
            suites=(); for i in "${!all[@]}"; do [ $((i % 4)) -eq ${{ matrix.shard }} ] && suites+=("${all[$i]}"); done
            bash templates/ci/bin/deadbugs.sh "$RUNNER_TEMP/den" "$RUNNER_TEMP/den.tsv" "${suites[@]}"
            bash templates/ci/bin/deadbugs.sh "$PWD" "$RUNNER_TEMP/dungeon.tsv" "${suites[@]}"
            echo "Den PASS: $(grep -c PASS "$RUNNER_TEMP/den.tsv")  dungeon PASS: $(grep -c PASS "$RUNNER_TEMP/dungeon.tsv")  of ${#suites[@]}"
            # regress = PASS on Den, not PASS on dungeon
            join -t "$(printf "\t")" <(cut -f1,2 "$RUNNER_TEMP/den.tsv" | sort) <(cut -f1,2 "$RUNNER_TEMP/dungeon.tsv" | sort) \
              | awk -F"\t" "\$2==\"PASS\" && \$3!=\"PASS\" {print \"FAIL on dungeon: \" \$1; bad=1} END {exit bad}"
          '
